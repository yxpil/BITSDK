name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/fake_bit_server.js &
      - run: sleep 1 && node test/smoke.mjs
        working-directory: javascript

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: node test/fake_bit_server.js &
      - run: go vet ./... && go test -v ./...
        working-directory: go

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: node test/fake_bit_server.js &
      - run: cargo test
        working-directory: rust

  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: node test/fake_bit_server.js &
      - run: ./run-smoke.sh
        working-directory: java

  c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - run: node test/fake_bit_server.js &
      - run: make smoke && ./build/smoke
        working-directory: c

  lua:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - run: node test/fake_bit_server.js &
      - run: lua5.4 test/smoke.lua
        working-directory: lua

  csharp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: node test/fake_bit_server.js &
      - run: dotnet run --project test
        working-directory: csharp
